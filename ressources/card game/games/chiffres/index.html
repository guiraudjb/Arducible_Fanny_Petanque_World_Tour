<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Le Compte est Bon — Fanny Pétanque World Tour</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="sr-only">Le Compte est Bon (épreuve des chiffres) — Fanny Pétanque World Tour</h1>

  <div class="table" id="table">
    <header class="hud">
      <div class="hud-money">
        <span class="hud-label">Bankroll</span>
        <span class="hud-value" id="bankroll">500</span>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <span class="timer hidden" id="timer" aria-live="polite">45</span>
      <button type="button" class="icon-btn" id="btn-mute" aria-pressed="false" aria-label="Couper la voix de la croupière">🔊</button>
      <button type="button" class="btn btn-ghost" id="btn-new-game">Nouvelle&nbsp;partie</button>
    </header>

    <div class="scene">
      <img class="scene-img" src="../../assets/table/fanny-dealer-scene.jpg" alt="Fanny vous accueille au Compte est Bon." />
      <div class="dealer-bubble" id="dealer-bubble" aria-live="polite">
        <p id="dealer-bubble-text"></p>
      </div>
    </div>

    <section class="play-zone" aria-label="Le compte est bon">
      <!-- Phase : mise -->
      <div class="panel" id="betting-panel">
        <p class="panel-title">Combien de grandes plaques (25, 50, 75, 100) ?</p>
        <div class="big-picker" id="big-picker" role="group" aria-label="Nombre de grandes plaques"></div>
        <p class="hint">Les autres plaques seront des petites (1 à 10).</p>
      </div>

      <!-- Phase : jeu -->
      <div class="panel hidden" id="play-panel">
        <p class="target-label">Cible à atteindre</p>
        <p class="target-value" id="target-value">—</p>
        <div class="plaques-row" id="plaques-row" role="group" aria-label="Plaques et résultats disponibles"></div>
        <div class="ops-row" id="ops-row" role="group" aria-label="Opérations">
          <button type="button" class="op-btn" data-op="+">+</button>
          <button type="button" class="op-btn" data-op="-">−</button>
          <button type="button" class="op-btn" data-op="x">×</button>
          <button type="button" class="op-btn" data-op="/">÷</button>
        </div>
        <p class="op-hint" id="op-hint">Choisissez deux plaques puis une opération.</p>
        <div class="history-log" id="history-log" aria-label="Calculs effectués"></div>
        <button type="button" class="btn btn-primary" id="btn-validate" disabled>Valider ce nombre</button>
      </div>

      <!-- Phase : résultat -->
      <div class="panel hidden" id="result-panel">
        <p class="result-message" id="result-message"></p>
        <p class="result-detail" id="result-detail"></p>
        <p class="result-solution" id="result-solution"></p>
      </div>
    </section>

    <footer class="dock">
      <div class="dock-panel" id="betting-area">
        <div class="bet-readout">
          <span class="bet-label">Mise</span>
          <span class="bet-amount" id="bet-amount">0</span>
        </div>
        <div class="chips" role="group" aria-label="Jetons de mise">
          <button type="button" class="chip" data-chip="10"><span>10</span></button>
          <button type="button" class="chip" data-chip="25"><span>25</span></button>
          <button type="button" class="chip" data-chip="50"><span>50</span></button>
          <button type="button" class="chip" data-chip="100"><span>100</span></button>
        </div>
        <div class="dock-buttons">
          <button type="button" class="btn btn-ghost" id="btn-clear-bet">Effacer mise</button>
          <button type="button" class="btn btn-primary" id="btn-start">Miser et tirer</button>
        </div>
      </div>

      <div class="dock-panel hidden" id="result-area">
        <div class="dock-buttons">
          <button type="button" class="btn btn-primary" id="btn-next-round">Manche&nbsp;suivante</button>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
